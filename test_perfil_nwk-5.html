<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test de Perfil NWK</title><style>body{font-family:Arial,sans-serif;background:#111;color:#f5f5f5;margin:0;padding:24px}main{max-width:620px;margin:auto}.card{background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:26px}h1{font-size:26px;margin:0 0 8px}.muted{color:#aaa;line-height:1.5}button,.wa{width:100%;box-sizing:border-box;padding:15px;margin-top:10px;border-radius:12px;border:1px solid #555;background:#242424;color:#fff;font-size:16px;text-align:left;cursor:pointer}.primary,.wa{background:#c9a227;border-color:#c9a227;color:#111;text-align:center;font-weight:bold;text-decoration:none;display:block}.bar{height:7px;background:#333;border-radius:9px;margin:14px 0 24px}.fill{height:100%;background:#c9a227;border-radius:9px}</style></head><body><main><div class="card" id="app"></div></main><script>const qs=[["¿Qué estás buscando principalmente?",["Un ingreso extra","Un cambio laboral","Emprender algo propio","Más libertad de tiempo"]],["¿Cuánto tiempo podrías dedicar de manera constante?",["2–3 horas por semana","1 hora por día","2 horas por día","Más de 2 horas por día"]],["¿Qué tan dispuesto/a estás a aprender algo nuevo?",["Mucho","Bastante","Estoy dispuesto/a a intentarlo","Poco"]],["¿Cómo te sentís hablando con personas nuevas?",["Me gusta","Puedo hacerlo","Necesitaría aprender","No es algo que me interese"]],["¿Qué te atrae más?",["Generar ingresos","Vender productos","Desarrollarme","Construir un equipo"]],["¿Estarías dispuesto/a a capacitarte y aplicar un método?",["Sí, totalmente","Sí, si veo que funciona","Probablemente","No estoy seguro/a"]],["Si pudieras comenzar paralelamente a tu actividad actual, ¿te interesaría?",["Sí, mucho","Sí, quiero analizarlo","Tal vez","Solo tengo curiosidad"]],["Después de conocer la propuesta, ¿qué preferirías hacer?",["Quiero una presentación","Quiero conversar","Quiero recibir información","Solo quiero explorar"]]];let i=0,score=0;const app=document.getElementById('app');function home(){app.innerHTML='<h1>¿Esta actividad puede encajar con vos?</h1><p class="muted">IMPARABLES DE PURA SANGRE NWK</p><p class="muted">Respondé 8 preguntas. No hay respuestas correctas o incorrectas. La idea es descubrir qué estás buscando y si vale la pena conocer una propuesta de actividad independiente.</p><button class="primary" onclick="start()">Comenzar test</button>'}function start(){i=0;score=0;show()}function show(){let q=qs[i];app.innerHTML='<div class="muted">Pregunta '+(i+1)+' de '+qs.length+'</div><div class="bar"><div class="fill" style="width:'+((i+1)/qs.length*100)+'%"></div></div><h1>'+q[0]+'</h1>'+q[1].map((x,n)=>'<button onclick="answer('+n+')">'+x+'</button>').join('')}function answer(n){score+=n;i++;i<qs.length?show():finish()}function finish(){let d=score>=22?["Tu perfil muestra una intención concreta","Tus respuestas indican que puede valer la pena conocer en profundidad cómo funciona la actividad.","Quiero conocer la propuesta","Hola Víctor, hice el Test de Perfil NWK y quiero conocer la propuesta."]:score>=14?["Tu perfil muestra interés","Hay varios aspectos que podrían encajar con lo que estás buscando. El próximo paso puede ser conversar y resolver tus dudas.","Quiero conversar","Hola Víctor, hice el Test de Perfil NWK y quiero conversar sobre la propuesta."]:["Estás explorando posibilidades","Todavía estás descubriendo qué buscás. Podés conocer la propuesta sin compromiso y después decidir.","Quiero recibir información","Hola Víctor, hice el Test de Perfil NWK y quiero recibir información."];let wa='https://wa.me/543884137042?text='+encodeURIComponent(d[3]);app.innerHTML='<h1>'+d[0]+'</h1><p class="muted">'+d[1]+'</p><a class="wa" href="'+wa+'">'+d[2]+' →</a><button onclick="home()">Volver a comenzar</button>'}home();</script></body></html>
