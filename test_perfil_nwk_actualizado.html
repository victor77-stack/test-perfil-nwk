<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test de Perfil NWK</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Arial;padding:24px}.card{max-width:620px;margin:18px auto;background:#1b1b1b;border:1px solid #444;border-radius:24px;padding:28px}h1{font-size:34px}.brand,.score{color:#d4aa25;font-weight:bold}p{color:#bbb;font-size:19px;line-height:1.5}button,.btn{width:100%;display:block;border:0;border-radius:14px;padding:18px;margin:12px 0;font-size:18px;text-decoration:none}.go,.btn{background:#d4aa25;color:#111;font-weight:bold;text-align:center}.opt{background:#292929;color:#eee;text-align:left;border:1px solid #444}.small{text-align:center;color:#888}.result{text-align:center;font-size:28px;font-weight:bold}.score{text-align:center;font-size:22px}</style></head><body><div class="card" id="app"></div><script>
const Q=[
["¿Qué estás buscando principalmente?",["Emprender algo propio","Más libertad de tiempo","Un ingreso extra","Un cambio laboral"]],
["¿Cuánto tiempo podrías dedicar de manera constante?",["Más de 2 horas por día","2 horas por día","1 hora por día","2–3 horas por semana"]],
["¿Qué tan dispuesto/a estás a aprender algo nuevo?",["Mucho","Bastante","Estoy dispuesto/a a intentarlo","Poco"]],
["¿Cómo te sentís hablando con personas nuevas?",["Me gusta","Puedo hacerlo","Necesitaría aprender","No es algo que me interese"]],
["¿Qué te atrae más?",["Construir un equipo","Desarrollarme","Generar ingresos","Conocer los productos"]],
["¿Estarías dispuesto/a a capacitarte y aplicar un método?",["Sí, totalmente","Sí, si veo que funciona","Probablemente","No estoy seguro/a"]],
["Si pudieras comenzar paralelamente a tu actividad actual, ¿te interesaría?",["Sí, mucho","Sí, quiero analizarlo","Tal vez","Solo tengo curiosidad"]],
["Después de conocer la propuesta, ¿qué preferirías hacer?",["Quiero una presentación","Quiero conversar","Quiero recibir información","Solo quiero explorar"]]
];let n=0,s=0,A=document.getElementById("app");
function home(){A.innerHTML='<h1>¿Esta actividad puede encajar con vos?</h1><div class="brand">IMPARABLES DE PURA SANGRE NWK</div><p>Respondé 8 preguntas. No hay respuestas correctas o incorrectas. La idea es conocer qué estás buscando y si una actividad independiente puede encajar con tus objetivos.</p><button class="go" onclick="start()">Comenzar test</button><div class="small">Duración aproximada: 2 minutos</div>'}
function start(){n=0;s=0;show()}
function show(){let q=Q[n];A.innerHTML='<div class="small">Pregunta '+(n+1)+' de 8</div><h2>'+q[0]+'</h2>'+q[1].map((x,i)=>'<button class="opt" onclick="ans('+i+')">'+x+'</button>').join("")}
function ans(i){s+=3-i;n++;n<Q.length?show():done()}
function done(){let l,e,t,m;if(s>=18){l="INTENCIÓN";e="🟢";t="Tus respuestas muestran una disposición alta para conocer la propuesta con mayor profundidad.";m=`Hola Víctor, hice el Test de Perfil NWK. 🟢 INTENCIÓN – ${s}/24 puntos. Quiero conocer la propuesta.`}else if(s>=10){l="INTERÉS";e="🟡";t="Tus respuestas muestran interés. El siguiente paso puede ser conversar y conocer mejor cómo funciona la propuesta.";m=`Hola Víctor, hice el Test de Perfil NWK. 🟡 INTERÉS – ${s}/24 puntos. Quiero conversar sobre la propuesta.`}else{l="EXPLORACIÓN";e="🔵";t="Estás en una etapa de exploración. Podés recibir información y decidir si querés avanzar.";m=`Hola Víctor, hice el Test de Perfil NWK. 🔵 EXPLORACIÓN – ${s}/24 puntos. Quiero recibir información.`}let u="https://wa.me/5493884137042?text="+encodeURIComponent(m);A.innerHTML='<div class="result">'+e+' '+l+'</div><div class="score">'+s+'/24 puntos</div><p>'+t+'</p><a class="btn" href="'+u+'">Enviar mi resultado por WhatsApp</a><div class="small">Resultado orientativo basado únicamente en tus respuestas.</div>'}
home();</script></body></html>
